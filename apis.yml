aid: hatch
name: Hatch
description: >-
  Hatch is an AI-powered customer communication platform for service businesses,
  unifying voice, SMS, and email into a single system with custom AI agents (AI
  CSRs) that text and call leads and customers to qualify them, book
  appointments, and drive bottom-line growth without adding headcount. Products
  include Voice AI, Messaging AI, Journey Builder for multi-channel campaigns, a
  Knowledge Engine, and a Command Center for performance tracking. For
  developers, Hatch exposes a public REST API (bearer-token auth) whose primary
  operation upserts contacts into campaigns, a Bulk Export API for BI/analytics,
  and an outbound webhook surface (11 event types, EdDSA-signed) for pushing
  events to downstream systems and Zapier. Backed by Bessemer Venture Partners
  and True Ventures. Added to the API Evangelist network and enriched from the
  provider's own public developer surface.
